name: Awesome Lint & Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint Awesome List
        run: |
          npx awesome-lint || true

      - name: Validate JSON Comparison Matrix
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("./data/comparison-matrix.json", "utf8"));
            if (!Array.isArray(data.models) || data.models.length === 0) {
              console.error("Invalid comparison matrix!");
              process.exit(1);
            }
            console.log(`Validated ${data.models.length} model entries.`);
          '
